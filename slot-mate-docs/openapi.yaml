openapi: 3.1.0
info:
  title: slot-mate API
  version: 1.2.0
  description: |
    Time-slot booking at service providers (barbers, clinics, gyms).
    All ids are UUIDs (`string`, `format: uuid`), stored in MySQL as `BINARY(16)`.
    Times are local time (`LocalDateTime`), without a time zone: `2026-10-20T10:00:00`.
    Errors use the `ProblemDetail` shape (RFC 9457).
servers:
  - url: http://localhost:8080
    description: local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Accounts and JWT tokens
  - name: categories
    description: Provider business domains
  - name: providers
    description: Business profiles
  - name: offerings
    description: Services offered by a provider
  - name: slots
    description: Published time slots
  - name: bookings
    description: Bookings

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Create a client or provider account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Return a JWT token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/me:
    get:
      tags: [auth]
      summary: The user in the token
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/categories:
    get:
      tags: [categories]
      summary: All categories
      operationId: getCategories
      security: []
      responses:
        '200':
          description: OK, ordered by `name`; an empty array when there are none
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }
    post:
      tags: [categories]
      summary: Add a category (ADMIN)
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/providers:
    get:
      tags: [providers]
      summary: Search providers
      operationId: searchProviders
      security: []
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: city
          in: query
          schema: { type: string }
          example: Cluj-Napoca
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [providers]
      summary: Create the business profile of the logged-in user (PROVIDER)
      operationId: createMyProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/providers/me:
    get:
      tags: [providers]
      summary: My business profile (PROVIDER)
      operationId: getMyProvider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [providers]
      summary: Update my business profile (PROVIDER)
      operationId: updateMyProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/providers/{providerId}:
    get:
      tags: [providers]
      summary: One provider
      operationId: getProvider
      security: []
      parameters:
        - $ref: '#/components/parameters/providerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/providers/{providerId}/offerings:
    get:
      tags: [offerings]
      summary: Active services of a provider
      operationId: getProviderOfferings
      security: []
      parameters:
        - $ref: '#/components/parameters/providerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OfferingResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/offerings:
    post:
      tags: [offerings]
      summary: Add a service to my business (PROVIDER)
      operationId: createOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferingRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/offerings/{offeringId}:
    put:
      tags: [offerings]
      summary: Update one of my services (PROVIDER, owner)
      operationId: updateOffering
      parameters:
        - $ref: '#/components/parameters/offeringId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferingRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [offerings]
      summary: Deactivate one of my services (PROVIDER, owner)
      operationId: deactivateOffering
      description: Sets `active = false`; existing slots and bookings are kept.
      parameters:
        - $ref: '#/components/parameters/offeringId'
      responses:
        '204':
          description: Deactivated
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/offerings/{offeringId}/slots:
    get:
      tags: [slots]
      summary: Time slots of a service
      operationId: getSlots
      security: []
      parameters:
        - $ref: '#/components/parameters/offeringId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-20'
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-26'
        - name: available
          in: query
          description: '`true` = only slots that are not booked'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK, ordered by `startTime`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SlotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [slots]
      summary: Publish a time slot for one of my services (PROVIDER, owner)
      operationId: createSlot
      description: '`endTime` = `startTime` + the service''s `durationMinutes`.'
      parameters:
        - $ref: '#/components/parameters/offeringId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/slots/{slotId}:
    delete:
      tags: [slots]
      summary: Delete a slot that is not booked (PROVIDER, owner)
      operationId: deleteSlot
      parameters:
        - $ref: '#/components/parameters/slotId'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/bookings:
    post:
      tags: [bookings]
      summary: Book a time slot (CLIENT)
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/bookings/me:
    get:
      tags: [bookings]
      summary: My bookings (CLIENT)
      operationId: getMyBookings
      responses:
        '200':
          description: OK, ordered by `slot.startTime`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/providers/me/bookings:
    get:
      tags: [bookings]
      summary: Bookings at my business (PROVIDER)
      operationId: getMyProviderBookings
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK, ordered by `slot.startTime`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/bookings/{bookingId}:
    delete:
      tags: [bookings]
      summary: Cancel a booking (its client or the slot's provider)
      operationId: cancelBooking
      description: Deletes the row from `bookings`; the slot becomes free again.
      parameters:
        - $ref: '#/components/parameters/bookingId'
      responses:
        '204':
          description: Cancelled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token from `/api/auth/login`. The `role` claim = `CLIENT` | `PROVIDER` | `ADMIN`.'

  parameters:
    providerId:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 0b8f4d2a-1e3c-4f5a-8b6d-9e0f1a2b3c4d
    offeringId:
      name: offeringId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 5d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f4a
    slotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
    bookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: e4d3c2b1-a0f9-4e8d-b7c6-b5a4f3e2d1c0

  responses:
    BadRequest:
      description: Invalid data, including an id that is not a valid UUID
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Validation failed
            instance: /api/bookings
            errors:
              slotId: must not be null
    Unauthorized:
      description: Missing or invalid token, or wrong login credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Wrong role, or the resource is not yours
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Does not exist
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Slot 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d not found
            instance: /api/bookings
    Conflict:
      description: Breaks a uniqueness rule, or the resource is still in use
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: Slot 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d is already booked
            instance: /api/bookings

  schemas:
    Role:
      type: string
      enum: [CLIENT, PROVIDER, ADMIN]

    RegisterRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email: { type: string, format: email, maxLength: 255, example: ana@example.com }
        password: { type: string, minLength: 8, maxLength: 100, example: password123 }
        fullName: { type: string, minLength: 1, maxLength: 100, example: Ana Pop }
        phone: { type: [string, 'null'], maxLength: 20, example: '0722123456' }
        role:
          type: string
          enum: [CLIENT, PROVIDER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ana@example.com }
        password: { type: string, example: password123 }

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiJ9... }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: seconds, example: 3600 }

    UserResponse:
      type: object
      required: [id, email, fullName, role, createdAt]
      properties:
        id: { type: string, format: uuid, example: 3f2b8c1e-6a4d-4e0f-9b7a-1c2d3e4f5a61 }
        email: { type: string, example: ana@example.com }
        fullName: { type: string, example: Ana Pop }
        phone: { type: [string, 'null'], example: '0722123456' }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, example: '2026-10-14T19:30:00' }

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, description: 'Unique, case-insensitive', example: Barber }

    CategoryResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
        name: { type: string, example: Barber }

    ProviderRequest:
      type: object
      required: [categoryId, businessName, city, address]
      properties:
        categoryId: { type: string, format: uuid, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
        businessName: { type: string, minLength: 1, maxLength: 150, example: Barber Shop Central }
        description: { type: [string, 'null'], example: Classic and modern haircuts }
        city: { type: string, minLength: 1, maxLength: 100, example: Cluj-Napoca }
        address: { type: string, minLength: 1, maxLength: 255, example: Str. Memorandumului 10 }

    ProviderResponse:
      type: object
      required: [id, businessName, city, address, category]
      properties:
        id: { type: string, format: uuid, example: 0b8f4d2a-1e3c-4f5a-8b6d-9e0f1a2b3c4d }
        businessName: { type: string, example: Barber Shop Central }
        description: { type: [string, 'null'], example: Classic and modern haircuts }
        city: { type: string, example: Cluj-Napoca }
        address: { type: string, example: Str. Memorandumului 10 }
        category: { $ref: '#/components/schemas/CategoryResponse' }

    OfferingRequest:
      type: object
      required: [name, durationMinutes, price]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Men's haircut }
        description: { type: [string, 'null'], example: Wash included }
        durationMinutes: { type: integer, minimum: 1, example: 30 }
        price: { type: number, minimum: 0, example: 60.00 }

    OfferingResponse:
      type: object
      required: [id, providerId, name, durationMinutes, price, active]
      properties:
        id: { type: string, format: uuid, example: 5d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f4a }
        providerId: { type: string, format: uuid, example: 0b8f4d2a-1e3c-4f5a-8b6d-9e0f1a2b3c4d }
        name: { type: string, example: Men's haircut }
        description: { type: [string, 'null'], example: Wash included }
        durationMinutes: { type: integer, example: 30 }
        price: { type: number, example: 60.00 }
        active: { type: boolean, example: true }

    SlotRequest:
      type: object
      required: [startTime]
      properties:
        startTime:
          type: string
          description: In the future; the same service cannot have another slot with the same `startTime`.
          example: '2026-10-20T10:00:00'

    SlotResponse:
      type: object
      required: [id, offeringId, startTime, endTime, booked]
      properties:
        id: { type: string, format: uuid, example: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d }
        offeringId: { type: string, format: uuid, example: 5d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f4a }
        startTime: { type: string, example: '2026-10-20T10:00:00' }
        endTime: { type: string, example: '2026-10-20T10:30:00' }
        booked: { type: boolean, example: false }

    BookingRequest:
      type: object
      required: [slotId]
      properties:
        slotId: { type: string, format: uuid, example: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d }
        note: { type: [string, 'null'], maxLength: 255, example: I'll be there 5 minutes early }

    BookingResponse:
      type: object
      required: [id, slot, offeringName, providerName, clientName, createdAt]
      properties:
        id: { type: string, format: uuid, example: e4d3c2b1-a0f9-4e8d-b7c6-b5a4f3e2d1c0 }
        slot: { $ref: '#/components/schemas/SlotResponse' }
        offeringName: { type: string, example: Men's haircut }
        providerName: { type: string, example: Barber Shop Central }
        clientName: { type: string, example: Ana Pop }
        note: { type: [string, 'null'], example: I'll be there 5 minutes early }
        createdAt: { type: string, example: '2026-10-14T19:45:00' }

    ProblemDetail:
      type: object
      required: [title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Conflict }
        status: { type: integer, example: 409 }
        detail: { type: string, example: Slot 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d is already booked }
        instance: { type: string, example: /api/bookings }
        errors:
          type: object
          description: Only on a 400 validation error — field → message
          additionalProperties: { type: string }
